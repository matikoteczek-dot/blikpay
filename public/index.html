<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Stripe Checkout</title>
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body>
  <h1>Kup produkt</h1>
  <button id="checkout-button">Kup</button>

  <script>
    const stripe = Stripe('pk_live_51SSl6yEcDvXnqWOejPWylDHBATccixTQpJ31lDXjUovHQsejQtUbvijLlVZPlEAuYPrJYXinjP3vkX7sPqpFY5Cm00fLJNS1ES'); // Twój publiczny klucz Stripe

    document.getElementById('checkout-button').addEventListener('click', async () => {
      const res = await fetch('/create-checkout-session', { method: 'POST' });
      const session = await res.json();
      if(session.error){
        alert(session.error);
        return;
      }
      stripe.redirectToCheckout({ sessionId: session.id });
    });
  </script>
</body>
</html>
