<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Kup Produkt - 2 zł</title>
  <script src="https://js.stripe.com/v3/"></script>

  <style>
    body { font-family: Arial; text-align: center; padding-top: 80px; background: #f7f7f7; }
    button {
      background: #6772e5;
      color: #fff;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #5469d4; }
  </style>
</head>

<body>
  <h1>Kup Produkt</h1>
  <p>Cena: <strong>2 zł</strong></p>

  <button id="checkout-button">Kup teraz</button>

  <script>
    const stripe = Stripe("pk_live_51SSl6yEcDvXnqWOejPWylDHBATccixTQpJ31lDXjUovHQsejQtUbvijLlVZPlEAuYPrJYXinjP3vkX7sPqpFY5Cm00fLJNS1ES");

    document.getElementById("checkout-button").addEventListener("click", async () => {
      const response = await fetch("/create-checkout-session", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({})
      });

      const data = await response.json();

      if (data.id) {
        stripe.redirectToCheckout({ sessionId: data.id });
      } else {
        alert("Błąd tworzenia płatności");
      }
    });
  </script>
</body>
</html>
